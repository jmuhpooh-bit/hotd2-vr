name: Quest APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/quest-lifecycle
    paths:
      - '.github/workflows/quest-apk.yml'
      - 'core/**'
      - 'shell/android-studio/**'
      - 'CMakeLists.txt'
      - '.gitmodules'

permissions:
  contents: read

concurrency:
  group: quest-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      - name: Build Quest APK
        working-directory: shell/android-studio
        run: |
          chmod +x gradlew
          ./gradlew :flycast:assembleVr --console=plain --stacktrace --max-workers=2

      - name: Package APK and checksum
        run: |
          mkdir -p dist
          cp shell/android-studio/flycast/build/outputs/apk/vr/flycast-vr.apk dist/hotd2-vr-quest.apk
          cd dist
          sha256sum hotd2-vr-quest.apk > hotd2-vr-quest.apk.sha256

      - uses: actions/upload-artifact@v6
        with:
          name: hotd2-vr-quest-${{ github.run_number }}
          path: dist/hotd2-vr-quest.apk*
          if-no-files-found: error
          retention-days: 30

      - name: Save build diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: quest-build-diagnostics-${{ github.run_number }}
          path: |
            shell/android-studio/flycast/build/reports/
            shell/android-studio/flycast/.cxx/**/CMakeFiles/CMake*.log
          if-no-files-found: ignore
